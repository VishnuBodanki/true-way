<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent Dashboard</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('D:/trueway/parent.png') no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    position: relative;
  }
  .success-overlay {
    position: absolute;
    top: 3%;
    width: 100%;
    text-align: center;
    z-index: 2;
    font-size: 4vw;
    letter-spacing: .18em;
    font-weight: bold;
    color: #ffe066;
    text-shadow: 2px 6px 16px #222, 0 0 32px #000, 0 2px 24px #8b8007;
    user-select: none;
    pointer-events: none;
  }
  .container {
    background: rgba(0,0,0,0.72);
    padding: 44px 20px 28px 20px;
    border-radius: 28px;
    text-align: center;
    width: 96%;
    max-width: 1040px;
    max-height: 93vh;
    box-shadow: 0 16px 29px rgba(0,0,0,0.44);
    z-index: 3;
    position: relative;
    overflow:auto;
  }
  h1 {
    font-size: 2.2em;
    margin-bottom: 18px;
    margin-top: 0;
    letter-spacing: .08em;
  }
  .to-select {
    margin-bottom: 14px;
  }
  .stream-msg {
    font-size: 1.19em;
    font-weight: bold;
    background: rgba(255,255,255,0.09);
    padding: 13px 10px;
    margin: 5px auto 7px auto;
    border-radius: 10px;
    color: #ffe066;
    display: none;
    max-width: 490px;
  }
  .option-btn, .back-btn {
    display: inline-block;
    margin: 10px 6px 18px 10px;
    padding: 16px 44px;
    font-size: 1.2em;
    font-weight: bold;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    transition: 0.3s;
    color: #fff;
    background: #2898ad;
    box-shadow: 0 2px 7px #01323a6b;
  }
  .option-btn.selected {
    background: #ffe066 !important;
    color: #113343;
    border: 2px solid #ffe066;
  }
  .option-btn:disabled {
    filter: grayscale(0.38); opacity:.83; cursor: default;
  }
  .option-btn:hover, .back-btn:hover {
    opacity: 0.94;
    transform: scale(1.03);
  }
  .back-btn {
    background: #e94d55;
    font-size: 1.08em;
    padding: 10px 26px;
    border-radius: 10px;
    margin-top: 0;
    margin-bottom: 14px;
  }
  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    justify-content: center;
    margin-top: 16px;
    margin-bottom: 8px;
  }
  .card {
    background: rgba(255,255,255,0.14);
    padding: 20px 10px 18px 10px;
    width: 260px;
    min-height: 118px;
    border-radius: 15px;
    cursor: pointer;
    transition: 0.3s;
    font-size: 1.15em;
    font-weight: bold;
    color: #ffe066;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 1px 3px 8px #111a2c30;
    text-shadow: 1px 1px 6px #000, 0 2px 12px #b98c0f44;
  }
  .card:hover {
    background: rgba(255,255,255,0.26);
    transform: scale(1.045);
  }
  .details {
    margin-top: 16px;
    background: rgba(0,0,0,0.83);
    padding: 22px 16px 22px 16px;
    border-radius: 17px;
    display: none;
    text-align: left;
    max-height: 62vh;
    min-height: 80px;
    overflow-y: auto;
    color: #fffde7;
    font-size: 1em;
  }
  .details h2 {
    margin-top: 0;
    font-size: 1.33em;
    color: #ffe066;
    margin-bottom: 8px;
  }
  .details ul {
    margin: 10px 0 20px 30px;
    padding: 0;
  }
  .details b {
    color: #aafdc4;
  }
  .details .section {
    margin-bottom: 17px;
    margin-top: 13px;
    line-height: 1.6em;
    border-left: 4px solid #ffe06644;
    padding-left: 15px;
    font-size: 1.07em;
  }
  .details .govt {
    color: #9de9fa;
    margin-top: 10px;
    display:block;
    margin-bottom: 11px;
  }
  .details .jkentrance ul {
    margin: 10px 0 12px 36px;
    padding: 0;
    color: #ffe066;
  }
  .details .jkentrance a { color: #ffe066; text-decoration: underline; }
  .close-btn {
    display: block;
    margin: 11px auto 0 auto;
    padding: 8px 22px;
    background: #e94d55;
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-size: 1em;
    font-weight: bold;
  }
  @media(max-width: 900px){
    .container {padding:8px;}
    .success-overlay {font-size:7vw;}
  }
</style>
</head>
<body>
  <div class="success-overlay">SUCCESS</div>
  <div class="container">
    <h1>Parent Dashboard</h1>
    <div class="to-select" id="selectLevelWrap">
      <button class="option-btn btn-10" onclick="showCards('10')">Daughter/Son completed 10th</button>
      <button class="option-btn btn-12" onclick="showCards('12')">Daughter/Son completed 12th</button>
    </div>
    <div class="stream-msg" id="streamMsg"></div>
    <div>
      <button class="back-btn" id="backBtn" style="display:none;" onclick="backToLevel()">⬅ Back</button>
    </div>
    <div class="cards" id="cardsContainer"></div>
    <div class="details" id="detailsContainer">
      <h2 id="detailTitle"></h2>
      <div id="detailText"></div>
      <button class="close-btn" onclick="closeDetails()">Close</button>
    </div>
  </div>

let currentLevel = null;
let lastSelectedStreamIdx = null;
function showCards(level) {
  currentLevel = level;
  lastSelectedStreamIdx = null;
  document.getElementById('detailsContainer').style.display = "none";
  const cardsEl = document.getElementById('cardsContainer');
  cardsEl.innerHTML = "";
  document.querySelector('.btn-10').style.display = (level=="10") ? "inline-block": "none";
  document.querySelector('.btn-12').style.display = (level=="12") ? "inline-block": "none";
  document.querySelector('.btn-10').classList.toggle('selected',level=="10");
  document.querySelector('.btn-12').classList.toggle('selected',level=="12");
  document.getElementById('backBtn').style.display = "inline-block";
  const msgDiv = document.getElementById('streamMsg');
  msgDiv.style.display = "block";
  msgDiv.innerHTML = level=='10'
    ? "Choose stream after 10th for your daughter or son:"
    : "Choose stream after 12th for your daughter or son:";
  const streams = (level=='10') ? streams10 : streams12;
  cardsEl.style.display = 'flex';
  streams.forEach((s, idx)=>{
    let c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `<span>${s.title}</span>`;
    c.onclick = () => showDetails(s.title, s.text, idx);
    cardsEl.appendChild(c);
  });
}
function showDetails(title, text, streamIdx){
  const cardsEl = document.getElementById('cardsContainer');
  cardsEl.innerHTML = "";
  lastSelectedStreamIdx = streamIdx;
  let activeBtn = document.createElement('button');
  activeBtn.className = 'option-btn selected';
  activeBtn.style.marginBottom = '22px';
  activeBtn.textContent = title;
  activeBtn.disabled = true;
  cardsEl.appendChild(activeBtn);
  document.getElementById('detailTitle').textContent = title;
  document.getElementById('detailText').innerHTML = text;
  document.getElementById('detailsContainer').style.display = 'block';
  document.getElementById('streamMsg').style.display = "none";
}
function closeDetails(){
  document.getElementById('detailsContainer').style.display = 'none';
}
function backToLevel(){
  document.getElementById('detailsContainer').style.display = "none";
  document.getElementById('cardsContainer').style.display = "none";
  document.getElementById('backBtn').style.display = "none";
  document.getElementById('streamMsg').style.display = "none";
  document.querySelector('.btn-10').style.display = "inline-block";
  document.querySelector('.btn-12').style.display = "inline-block";
  document.querySelector('.btn-10').classList.remove('selected');
  document.querySelector('.btn-12').classList.remove('selected');
}
</script>
</body>
</html>
