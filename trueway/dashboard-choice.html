<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1d2671, #c33764);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 800px;
      padding: 20px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
    }

    .quote {
      font-size: 1.2em;
      margin-bottom: 30px;
      font-style: italic;
    }

    .dashboard-options {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card {
      background: rgba(255,255,255,0.1);
      border-radius: 15px;
      padding: 30px;
      width: 300px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255,255,255,0.6);
    }

    .card h2 {
      margin-bottom: 15px;
      font-size: 1.8em;
    }

    .card p {
      font-size: 1em;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome 🎓</h1>
    <p class="quote">"Guiding students and parents towards a brighter future!"</p>

    <div class="dashboard-options">
      <div class="card" onclick="goStudent()">
        <h2>👨‍🎓 Student Dashboard</h2>
        <p>Explore courses, career options, and guidance for students.</p>
      </div>

      <div class="card" onclick="goParent()">
        <h2>👩‍👦 Parent Dashboard</h2>
        <p>Discover opportunities, fee structures, and guidance for your child.</p>
      </div>
    </div>
  </div>

  <script>
    function goStudent() {
      window.location.href = "index.html"; // student dashboard (already created)
    }

    function goParent() {
      window.location.href = "parent.html"; // parent dashboard (already created)
    }
  </script>
</body>
</html>
