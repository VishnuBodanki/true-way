<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Career Guidance</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      min-width: 100vw;
      width: 100vw;
      height: 100vh;
      overflow-x: hidden;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: stretch;
      background: linear-gradient(rgba(20,20,60,0.8),rgba(20,20,60,0.8)), url("D:/CareerAdvisor/image_background_files/education-3d-icon-pack-png.webp") no-repeat center center;
      background-size: cover;
      background-blend-mode: overlay;
      color: white;
      font-family: Arial, sans-serif;
    }
    .center-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
    }
    h1 {
      font-size: 3em;
      margin-top: 38px;
      margin-bottom: 16px;
      background: linear-gradient(90deg, red, orange, green, #708090, white);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: bold;
      text-align: center;
    }
    .quote {
      font-size: 1.18em;
      font-style: italic;
      color: #FFE066;
      text-align: center;
      margin: 0 0 40px 0;
      letter-spacing: 0.5px;
      font-weight: 500;
      text-shadow: 0 2px 8px #00000044;
      padding: 2px 18px;
    }
    .choose-stream {
      font-size: 1.19em;
      margin-bottom: 18px;
      color: #fff;
      font-weight: bold;
      text-align: center;
      letter-spacing: 1px;
    }
    .main-choice {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 32px;
      margin-bottom: 0;
      margin-top: 0;
    }
    .main-choice button {
      font-size: 1.3em;
      padding: 17px 55px;
      border-radius: 40px;
      font-weight: bold;
      background: #ff9800;
      color: #fff;
      box-shadow: 0 2px 10px #21212133;
      border: none;
      letter-spacing: 1.1px;
      margin: 0 8px;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
    }
    .main-choice button:active,
    .main-choice button:focus {
      box-shadow: 0 1px 22px #ff980077;
      outline: none;
      background: #f57c00;
    }
    .main-choice button:hover {
      background: #f57c00;
      color: #fff3e0;
      transform: scale(1.05);
      cursor: pointer;
    }
    .streams-wrap {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 28px 38px;
      margin-bottom: 30px;
      width: 100%;
      max-width: 700px;
    }
    .streams-wrap button {
      flex: 1 0 180px;
      max-width: 210px;
      min-width: 140px;
      margin: 0 8px 12px 8px;
    }
    button {
      padding: 16px 40px;
      font-size: 1.12em;
      border: none;
      border-radius: 36px;
      background: linear-gradient(45deg, #ff7f50, #ff6347);
      color: white;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      font-weight: bold;
      margin: 0;
      position: relative;
    }
    button:hover {
      transform: scale(1.06);
      box-shadow: 0 0 18px #ff0033;
    }
    button::after {
      content: "✨";
      position: absolute;
      right: 20px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    button:hover::after {
      opacity: 1;
    }
    .info-card {
      background: white;
      color: #222;
      border-radius: 22px;
      box-shadow: 0 2px 18px rgba(20, 20, 60, 0.13);
      padding: 30px 34px 24px 34px;
      margin-top: 28px;
      min-width: 300px;
      max-width: 440px;
      text-align: left;
      font-size: 1.13em;
      display: inline-block;
      position: relative;
    }
    .info-card h3 {
      margin-top: 0;
    }
    .info-item-label {
      font-weight: bold;
      color: #6845ad;
      margin-right: 10px;
    }
    ul.info-list {
      list-style-type: none;
      padding-left: 10px;
      margin: 0;
    }
    ul.info-list li {
      margin-bottom: 8px;
      padding-left: 0;
      line-height: 1.8;
    }
    .back-btn {
      margin: 42px auto 0 auto;
      background: linear-gradient(90deg, #222242 60%, #ffb900, #ff6f61 90%);
      color: #fff;
      border-radius: 30px;
      font-size: 1.15em;
      padding: 14px 54px;
      font-weight: bold;
      border: 2px solid #ffb900;
      letter-spacing: 0.7px;
      display: block;
      box-shadow: 0 4px 12px rgba(20,20,60,0.13);
      opacity: 0.98;
      z-index: 10;
      transition: background 0.2s;
    }
    .back-btn:hover {
      background: linear-gradient(90deg, #ff4e50, #FFD700 92%, #964B00);
      color: #fff;
    }
    @media (max-width: 720px) {
      h1 { font-size: 2.2em; }
      .main-choice button { font-size: 1em; padding: 13px 12vw;}
      .streams-wrap { max-width: 99vw; padding: 0 2vw;}
      .info-card { min-width: 80vw; max-width: 94vw; padding: 18px 5vw;}
      button { font-size: 1em; padding: 12px 6vw;}
      .main-choice { gap: 12px; }
      .quote { font-size: 1em; padding: 0 5vw;}
    }
  </style>
</head>
<body>
  <h1>Career Guidance</h1>
  <div class="quote">Education is the most powerful weapon in the world.</div>
  <div class="center-content">
    <div class="choose-stream" id="chooseStreamMsg">Choose Stream: 10<sup>th</sup> or 12<sup>th</sup></div>
    <div class="main-choice" id="main-choice">
      <button onclick="showStreams('10th')">10th</button>
      <button onclick="showStreams('12th')">12th</button>
    </div>
    <div id="streams"></div>
    <div id="info-box"></div>
    <button class="back-btn" id="backBtn" onclick="goBack()" style="display:none;">⬅ Back</button>
  </div>
  <script>
    let currentLevel = null;
    function showStreams(level) {
      currentLevel = level;
      document.getElementById("main-choice").style.display = "none";
      document.getElementById("chooseStreamMsg").style.display = "none";
      document.getElementById("streams").innerHTML = "";
      document.getElementById("info-box").innerHTML = "";
      document.getElementById("backBtn").style.display = "block";
      let streamsHtml = "";
      if (level === "10th") {
        streamsHtml = `<div class="streams-wrap">
          <button onclick="showOpportunities('MPC')">MPC</button>
          <button onclick="showOpportunities('BiPC')">BiPC</button>
          <button onclick="showOpportunities('CEC')">CEC</button>
          <button onclick="showOpportunities('Arts')">Arts</button>
        </div>`;
      } else {
        streamsHtml = `<div class="streams-wrap">
          <button onclick="showOpportunities('Engineering')">Engineering</button>
          <button onclick="showOpportunities('Medical')">Medical</button>
          <button onclick="showOpportunities('Law')">Law</button>
          <button onclick="showOpportunities('Commerce')">Commerce</button>
          <button onclick="showOpportunities('Management')">Management</button>
          <button onclick="showOpportunities('Design')">Design</button>
          <button onclick="showOpportunities('Fashion')">Fashion</button>
          <button onclick="showOpportunities('Navy')">Navy</button>
          <button onclick="showOpportunities('Army')">Army</button>
          <button onclick="showOpportunities('Civil Services')">Civil Services</button>
        </div>`;
      }
      document.getElementById("streams").innerHTML = streamsHtml;
    }
    function showOpportunities(stream) {
      document.getElementById("streams").innerHTML = "";
      let info = "";
      function infoList(govt, priv, abr) {
        return `<ul class="info-list">
          <li><span class="info-item-label">Govt job opportunities:</span> ${govt}</li>
          <li><span class="info-item-label">Private job opportunities:</span> ${priv}</li>
          <li><span class="info-item-label">Abroad opportunities:</span> ${abr}</li>
        </ul>`;
      }
      if (currentLevel === "10th") {
        if (stream === "MPC") {
          info = `<h3>MPC (Maths, Physics, Chemistry)</h3>` + 
            infoList(
              "Defence, Railways, Civil Services, PSU Jobs",
              "Engineering, IT, Data Science",
              "Research, Aerospace, Robotics"
            );
        } else if (stream === "BiPC") {
          info = `<h3>BiPC (Biology, Physics, Chemistry)</h3>` + 
            infoList(
              "Medical, Agriculture, Pharmacy, Govt Hospitals",
              "Healthcare, Medical Labs, Biotech Startups",
              "MBBS/MD, Biomedical, Research"
            );
        } else if (stream === "CEC") {
          info = `<h3>CEC (Civics, Economics, Commerce)</h3>` + 
            infoList(
              "Clerical, SSC CGL, Railways, Defence, Civil Services",
              "B.Com, CA/CS/CMA, Auditing, Banking, Insurance",
              "Business Administration, International Trade"
            );
        } else if (stream === "Arts") {
          info = `<h3>Arts Stream</h3>` + 
            infoList(
              "UPSC, SSC CGL, Teaching, Indian Railways",
              "Mass Communication, Journalism, Interior Design",
              "Fine Arts, Social Science, Animation"
            );
        }
      } else {
        if (stream === "Engineering") {
          info = `<h3>Engineering</h3>` + 
            infoList(
              "ISRO, DRDO, PSU Jobs, UPSC Engineering Services",
              "MNC Jobs, Startups, Product Development",
              "MS, Research, Corporate Jobs"
            );
        } else if (stream === "Medical") {
          info = `<h3>Medical</h3>` + 
            infoList(
              "AIIMS, Govt Hospitals, Armed Forces Medical",
              "Clinics, Hospitals, Health-tech Startups",
              "MD, Medical Research"
            );
        } else if (stream === "Law") {
          info = `<h3>Law</h3>` + 
            infoList(
              "Judiciary, Legal Advisor, Public Prosecutor, UPSC",
              "Corporate Law Firms, NGOs",
              "LLM, International Law"
            );
        } else if (stream === "Commerce") {
          info = `<h3>Commerce</h3>` + 
            infoList(
              "Banking, Railways, PSU, Civil Services",
              "Finance, Accounting, Audit, Consultancy",
              "MBA, CFA, Business Analytics"
            );
        } else if (stream === "Management") {
          info = `<h3>Management</h3>` + 
            infoList(
              "Tourism, PSU Management Trainee",
              "Startups, Marketing, HR, Operations",
              "International Business, Hospitality"
            );
        } else if (stream === "Design") {
          info = `<h3>Design</h3>` + 
            infoList(
              "NID, Government Museums, Indian Rail Design",
              "Gaming, Web Design, Architecture",
              "Digital Media, Industrial Design"
            );
        } else if (stream === "Fashion") {
          info = `<h3>Fashion</h3>` + 
            infoList(
              "Handicrafts, Government Apparel Design",
              "Fashion Houses, Boutiques, Retail",
              "Brand Merchandising, Modelling"
            );
        } else if (stream === "Navy") {
          info = `<h3>Navy</h3>` + 
            infoList(
              "Naval Officer, Marine Engineering, Coast Guard",
              "Marine Operations, International Cruise Lines",
              "Offshore Marine Jobs, Defense Research"
            );
        } else if (stream === "Army") {
          info = `<h3>Army</h3>` + 
            infoList(
              "Infantry, Engineers, Ordinance, Signals",
              "Defense Tech, Security Firms, Disaster Relief",
              "UN Peacekeeping, Security Advisor"
            );
        } else if (stream === "Civil Services") {
          info = `<h3>Civil Services</h3>` + 
            infoList(
              "IAS, IPS, IRS, IFS, State Services",
              "Policy Think Tanks, NGOs, International Agencies",
              "Policy Research, UN/World Bank"
            );
        }
      }
      document.getElementById("info-box").innerHTML = `<div class="info-card">${info}</div>`;
    }
    function goBack() {
      document.getElementById("streams").innerHTML = "";
      document.getElementById("info-box").innerHTML = "";
      document.getElementById("main-choice").style.display = "flex";
      document.getElementById("chooseStreamMsg").style.display = "block";
      document.getElementById("backBtn").style.display = "none";
      currentLevel = null;
    }
  </script>
</body>
</html>
